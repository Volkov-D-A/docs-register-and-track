# Disposable PostgreSQL and SeaweedFS instances for integration tests. It is intentionally
# separate from docker-compose.yaml, which serves the local development stack.
services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18.3}-alpine
    environment:
      POSTGRES_USER: docflow_integration
      POSTGRES_PASSWORD: docflow_integration
      POSTGRES_DB: docflow_test_outbox
    ports:
      - "127.0.0.1:${DOCFLOW_TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow_integration -d docflow_test_outbox"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      # PostgreSQL 18+ stores data in a versioned subdirectory under this
      # mount point; it also remains compatible with the development compose.
      - integration_pgdata:/var/lib/postgresql
  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    command: mini -dir=/data -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: docflow_integration
      AWS_SECRET_ACCESS_KEY: docflow_integration_secret
    ports:
      - "127.0.0.1:${DOCFLOW_TEST_S3_PORT:-58333}:8333"
    volumes:
      - integration_s3data:/data
  s3-ready:
    pull_policy: never
    build:
      context: .
      dockerfile: build/server/Dockerfile
    image: docflow-server:integration
    command: ["storage", "check"]
    healthcheck:
      disable: true
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: docflow_integration
      S3_SECRET_ACCESS_KEY: docflow_integration_secret
    depends_on:
      seaweedfs:
        condition: service_started

  docflow-server:
    profiles: [smoke]
    image: docflow-server:integration
    pull_policy: never
    build:
      context: .
      dockerfile: build/server/Dockerfile
    environment:
      POSTGRES_CONTAINER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: docflow_integration
      POSTGRES_PASSWORD: docflow_integration
      POSTGRES_DB: docflow_test_outbox
      POSTGRES_SSLMODE: disable
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: docflow_integration
      S3_SECRET_ACCESS_KEY: docflow_integration_secret
      S3_BUCKET: docflow-test-smoke
      DOCFLOW_SERVER_LISTEN_ADDRESS: :8080
      DOCFLOW_OUTBOX_POLLING_INTERVAL_SECONDS: 1
      SEQ_ENABLED: false
    ports:
      - "127.0.0.1:${DOCFLOW_TEST_SERVER_PORT:-58080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      s3-ready:
        condition: service_completed_successfully
    stop_grace_period: 40s

volumes:
  integration_pgdata:
  integration_s3data:
