# Development: HTTP. Production example differs only in Caddy TLS configuration.
services:
  postgres:
    image: postgres:${POSTGRES_VERSION}-alpine
    container_name: docflow_db
    secrets: [postgres_password]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.46}
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_key
    volumes:
      # mini stores both filer/master metadata and volume data below /data.
      - seaweedfs_data:/data
    # Read mounted secrets inside the container; $$ prevents Compose interpolation.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        AWS_ACCESS_KEY_ID=$$S3_ACCESS_KEY_ID
        AWS_SECRET_ACCESS_KEY=$$(cat "$$S3_SECRET_ACCESS_KEY_FILE")
        : "$${AWS_ACCESS_KEY_ID:?empty S3 access key}" "$${AWS_SECRET_ACCESS_KEY:?empty S3 secret key}"
        export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
        exec weed "$$@"
      - seaweedfs
    command: ["mini", "-dir=/data", "-s3.port=8333"]
    secrets: [s3_secret_key]
    restart: unless-stopped
  s3-ready:
    image: hehelf/docflow-service:${DOCFLOW_SERVER_VERSION:?Set DOCFLOW_SERVER_VERSION in .env}
    command: ["storage", "check"]
    healthcheck:
      disable: true
    secrets: [s3_secret_key]
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_key
    depends_on:
      seaweedfs:
        condition: service_started
  seq:
    image: datalust/seq:${SEQ_VERSION}
    container_name: docflow_seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINUSERNAME=${SEQ_ADMIN_USERNAME:-admin}
    secrets: [seq_admin_password]
    entrypoint:
      - /bin/sh
      - -ec
      - |
        test -s /run/secrets/seq_admin_password
        exec /bin/seqentry --default-admin-password-stdin < /run/secrets/seq_admin_password
    volumes:
      - seq_data:/data
    restart: unless-stopped
  docflow-server:
    image: hehelf/docflow-service:${DOCFLOW_SERVER_VERSION:?Set DOCFLOW_SERVER_VERSION in .env}
    pull_policy: always
    container_name: docflow_server
    secrets: [postgres_password, s3_secret_key, settings_key]
    volumes:
      - backup_staging:/var/lib/docflow/backups
    environment:
      POSTGRES_CONTAINER: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_key
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_BUCKET: ${S3_BUCKET}
      SEQ_URL: http://seq:80
      SEQ_ENABLED: ${SEQ_ENABLED:-true}
      DOCFLOW_OUTBOX_POLLING_INTERVAL_SECONDS: ${DOCFLOW_OUTBOX_POLLING_INTERVAL_SECONDS:-5}
      DOCFLOW_OUTBOX_BATCH_SIZE: ${DOCFLOW_OUTBOX_BATCH_SIZE:-50}
      DOCFLOW_OUTBOX_STALE_CLAIM_TIMEOUT_SECONDS: ${DOCFLOW_OUTBOX_STALE_CLAIM_TIMEOUT_SECONDS:-300}
      DOCFLOW_OUTBOX_CONSUMER_TIMEOUT_SECONDS: ${DOCFLOW_OUTBOX_CONSUMER_TIMEOUT_SECONDS:-30}
      DOCFLOW_OUTBOX_PROCESSED_RETENTION_DAYS: ${DOCFLOW_OUTBOX_PROCESSED_RETENTION_DAYS:-90}
      DOCFLOW_OUTBOX_CLEANUP_INTERVAL_MINUTES: ${DOCFLOW_OUTBOX_CLEANUP_INTERVAL_MINUTES:-60}
      DOCFLOW_BACKUP_DIRECTORY: /var/lib/docflow/backups
      DOCFLOW_BACKUP_MAX_BYTES: ${DOCFLOW_BACKUP_MAX_BYTES:-21474836480}
      DOCFLOW_SETTINGS_KEY_FILE: /run/secrets/settings_key
      DOCFLOW_SERVER_LISTEN_ADDRESS: :8080
      DOCFLOW_AUTH_SESSION_TTL_HOURS: ${DOCFLOW_AUTH_SESSION_TTL_HOURS:-12}
    depends_on:
      postgres:
        condition: service_healthy
      s3-ready:
        condition: service_completed_successfully
      seq:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 40s
    expose:
      - "8080"
  caddy:
    image: caddy:${CADDY_VERSION:?Set CADDY_VERSION in .env}
    container_name: docflow_caddy
    depends_on:
      docflow-server:
        condition: service_healthy
    ports:
      - "${DOCFLOW_SERVER_PORT:-8080}:80"
    volumes:
      - ./build/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
volumes:
  pgdata:
  seaweedfs_data:
  seq_data:
  backup_staging:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE_PATH:?Set POSTGRES_PASSWORD_FILE_PATH}
  seq_admin_password:
    file: ${SEQ_ADMIN_PASSWORD_FILE_PATH:?Set SEQ_ADMIN_PASSWORD_FILE_PATH}
  s3_secret_key:
    file: ${S3_SECRET_KEY_FILE_PATH:?Set S3_SECRET_KEY_FILE_PATH}
  settings_key:
    file: ${DOCFLOW_SETTINGS_KEY_PATH:?Set DOCFLOW_SETTINGS_KEY_PATH}
