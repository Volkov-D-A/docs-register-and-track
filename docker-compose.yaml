# LOCAL DEVELOPMENT EXAMPLE ONLY.
# docker-compose.yaml поднимает PostgreSQL/SeaweedFS/Seq/docflow-server/Caddy для
# закрытого dev-контура.
# Production topology, versions, secrets and network boundaries are defined by
# approved external production documentation, not by this compose file.
services:
  postgres:
    # Используем alpine-версию, так как она весит в разы меньше и быстрее скачивается
    image: postgres:${POSTGRES_VERSION}-alpine
    container_name: docflow_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
    volumes:
      # Маппим на /var/lib/postgresql (VOLUME из Dockerfile образа),
      # чтобы Docker не создавал анонимный том для этого пути.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.46}
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
    volumes:
      # mini stores both filer/master metadata and volume data below /data.
      - seaweedfs_data:/data
    command: mini -dir=/data -s3.port=8333
    restart: unless-stopped
  s3-ready:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "/scripts/s3-ready.sh"]
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
    volumes:
      - ./scripts/s3-ready.sh:/scripts/s3-ready.sh:ro
    depends_on:
      seaweedfs:
        condition: service_started
  seq:
    image: datalust/seq:${SEQ_VERSION}
    container_name: docflow_seq
    environment:
      # Подтверждение лицензионного соглашения (обязательно для запуска)
      - ACCEPT_EULA=Y
      # Опционально: можно сразу задать пароль администратора
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD}
    volumes:
      # Сохраняем логи в volume, чтобы они не пропали при перезапуске контейнера
      - seq_data:/data
    restart: unless-stopped
  docflow-server:
    image: docflow-server:local
    pull_policy: build
    build:
      context: .
      dockerfile: build/server/Dockerfile
    container_name: docflow_server
    environment:
      POSTGRES_CONTAINER: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_BUCKET: ${S3_BUCKET}
      SEQ_URL: http://seq:80
      SEQ_ENABLED: ${SEQ_ENABLED:-true}
      DOCFLOW_OUTBOX_POLLING_INTERVAL_SECONDS: ${DOCFLOW_OUTBOX_POLLING_INTERVAL_SECONDS:-5}
      DOCFLOW_OUTBOX_BATCH_SIZE: ${DOCFLOW_OUTBOX_BATCH_SIZE:-50}
      DOCFLOW_OUTBOX_STALE_CLAIM_TIMEOUT_SECONDS: ${DOCFLOW_OUTBOX_STALE_CLAIM_TIMEOUT_SECONDS:-300}
      DOCFLOW_OUTBOX_CONSUMER_TIMEOUT_SECONDS: ${DOCFLOW_OUTBOX_CONSUMER_TIMEOUT_SECONDS:-30}
      DOCFLOW_OUTBOX_PROCESSED_RETENTION_DAYS: ${DOCFLOW_OUTBOX_PROCESSED_RETENTION_DAYS:-90}
      DOCFLOW_OUTBOX_CLEANUP_INTERVAL_MINUTES: ${DOCFLOW_OUTBOX_CLEANUP_INTERVAL_MINUTES:-60}
      DOCFLOW_SERVER_LISTEN_ADDRESS: :8080
      DOCFLOW_AUTH_SESSION_TTL_HOURS: ${DOCFLOW_AUTH_SESSION_TTL_HOURS:-12}
    depends_on:
      postgres:
        condition: service_healthy
      s3-ready:
        condition: service_completed_successfully
      seq:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 40s
    expose:
      - "8080"
  caddy:
    image: caddy:${CADDY_VERSION:?Set CADDY_VERSION in .env}
    container_name: docflow_caddy
    depends_on:
      docflow-server:
        condition: service_healthy
    ports:
      - "${DOCFLOW_SERVER_PORT:-8080}:80"
    volumes:
      - ./build/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
volumes:
  pgdata:
  seaweedfs_data:
  seq_data:
