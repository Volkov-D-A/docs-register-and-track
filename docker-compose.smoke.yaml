# Overlay for the disposable integration stack; always builds current sources.
services:
  postgres:
    ports: !override ["127.0.0.1:55433:5432"]
  seaweedfs:
    ports: !override ["127.0.0.1:58334:8333"]
  docflow-server:
    image: docflow-server:integration
    pull_policy: build
    build:
      context: .
      dockerfile: build/server/Dockerfile
    environment:
      POSTGRES_CONTAINER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: docflow_integration
      POSTGRES_PASSWORD: docflow_integration
      POSTGRES_DB: docflow_test_outbox
      POSTGRES_SSLMODE: disable
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: docflow_integration
      S3_SECRET_ACCESS_KEY: docflow_integration_secret
      S3_BUCKET: docflow-test-smoke
      DOCFLOW_SERVER_LISTEN_ADDRESS: :8080
      DOCFLOW_OUTBOX_POLLING_INTERVAL_SECONDS: 1
      SEQ_ENABLED: false
    ports:
      - "127.0.0.1:58080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      s3-ready:
        condition: service_completed_successfully
    stop_grace_period: 40s
