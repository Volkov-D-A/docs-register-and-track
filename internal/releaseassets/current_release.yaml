version: 1.0.7
releasedAt: "2026-09-14"
changes:
    - title: Приложение разделено на клиент и сервер
      description: Работа с документами, аутентификация, база данных и файловое хранилище перенесены на сервер. Настольное приложение подключается к нему через HTTP API.
    - title: Выполнен переход с MinIO на SeaweedFS
      description: Для хранения вложений документов вместо MinIO используется SeaweedFS с доступом через S3 API.
    - title: Обновлён механизм резервного копирования
      description: Создание и восстановление резервных копий выполняются на сервере с хранением копий на SMB. Настройки подключения и расписания размещены в сворачиваемых панелях, отображаются этапы выполнения операций, а действия записываются в общий журнал.
    - title: Добавлены повторяемые поручения
      description: Появилась возможность создавать повторяемые поручения для регулярных задач.
    - title: Добавлено количество листов приложения
      description: В реквизитах документа можно указать количество листов приложения.
    - title: Различные исправления
      description: Исправлены ошибки и улучшена работа приложения.
