version: 1.0.7
releasedAt: "2026-09-14"
changes:
    - title: Приложение разделено на клиент и сервер
      description: Работа с документами, аутентификация, база данных и файловое хранилище перенесены на сервер. Настольное приложение подключается к нему через HTTP API.
    - title: Регистрация и учёт документов
      description: В приложении доступны журналы входящих и исходящих писем, обращений граждан и административных приказов, поиск, связи документов, статистика и отчёты.
    - title: Обновлён механизм резервного копирования
      description: Сервер создаёт и восстанавливает резервные копии PostgreSQL. Копии хранятся на SMB, а операции записываются в журнал действий администратора.
    - title: Контроль сроков исполнения
      description: Для документов можно создавать разовые и регулярные контроли, отслеживать сроки и результаты на рабочем столе и в отчётах.
    - title: Добавлено количество листов приложения
      description: В реквизитах документа можно указать количество листов приложения.
    - title: Различные исправления
      description: Исправлены ошибки и улучшена работа приложения.
