# Run from the repository/deployment root:
# docker compose --project-directory . --env-file .env -f docs/examples/docker-compose.prod.example.yaml up -d
# Or copy this example beside .env and the caddy and scripts directories before running it.
services:
  postgres:
    image: postgres:${POSTGRES_VERSION}-alpine
    container_name: ${DOCFLOW_POSTGRES_CONTAINER_NAME:-docflow_db}
    secrets: [postgres_password]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.46}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_key
    volumes:
      # mini stores both filer/master metadata and volume data below /data.
      - seaweedfs_data:/data
      - ./scripts/seaweedfs-entrypoint.sh:/usr/local/bin/docflow-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/docflow-entrypoint.sh"]
    command: ["mini", "-dir=/data", "-s3.port=8333"]
    secrets: [s3_secret_key]
    restart: unless-stopped
  seq:
    image: datalust/seq:${SEQ_VERSION}
    container_name: ${DOCFLOW_SEQ_CONTAINER_NAME:-docflow_seq}
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINUSERNAME=${SEQ_ADMIN_USERNAME:-admin}
    secrets: [seq_admin_password]
    entrypoint: ["/bin/sh", "/usr/local/bin/docflow-entrypoint.sh"]
    volumes:
      - seq_data:/data
      - ./scripts/seq-entrypoint.sh:/usr/local/bin/docflow-entrypoint.sh:ro
    restart: unless-stopped
  docflow-server:
    image: hehelf/docflow-service:${DOCFLOW_SERVER_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: ${DOCFLOW_SERVER_CONTAINER_NAME:-docflow_server}
    secrets: [postgres_password, s3_secret_key, settings_key]
    volumes:
      - backup_staging:/var/lib/docflow/backups
    environment:
      POSTGRES_CONTAINER: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_key
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_BUCKET: ${S3_BUCKET}
      SEQ_URL: http://seq:80
      SEQ_ENABLED: ${SEQ_ENABLED:-true}
      DOCFLOW_OUTBOX_POLLING_INTERVAL_SECONDS: ${DOCFLOW_OUTBOX_POLLING_INTERVAL_SECONDS:-5}
      DOCFLOW_OUTBOX_BATCH_SIZE: ${DOCFLOW_OUTBOX_BATCH_SIZE:-50}
      DOCFLOW_OUTBOX_STALE_CLAIM_TIMEOUT_SECONDS: ${DOCFLOW_OUTBOX_STALE_CLAIM_TIMEOUT_SECONDS:-300}
      DOCFLOW_OUTBOX_CONSUMER_TIMEOUT_SECONDS: ${DOCFLOW_OUTBOX_CONSUMER_TIMEOUT_SECONDS:-30}
      DOCFLOW_OUTBOX_PROCESSED_RETENTION_DAYS: ${DOCFLOW_OUTBOX_PROCESSED_RETENTION_DAYS:-90}
      DOCFLOW_OUTBOX_CLEANUP_INTERVAL_MINUTES: ${DOCFLOW_OUTBOX_CLEANUP_INTERVAL_MINUTES:-60}
      DOCFLOW_BACKUP_DIRECTORY: /var/lib/docflow/backups
      DOCFLOW_BACKUP_MAX_BYTES: ${DOCFLOW_BACKUP_MAX_BYTES:-21474836480}
      DOCFLOW_SETTINGS_KEY_FILE: /run/secrets/settings_key
      DOCFLOW_SERVER_LISTEN_ADDRESS: :8080
      DOCFLOW_AUTH_SESSION_TTL_HOURS: ${DOCFLOW_AUTH_SESSION_TTL_HOURS:-12}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      seq:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 40s
    expose:
      - "8080"
  caddy:
    image: caddy:${CADDY_VERSION:?Set CADDY_VERSION in .env}
    container_name: ${DOCFLOW_CADDY_CONTAINER_NAME:-docflow_caddy}
    depends_on:
      docflow-server:
        condition: service_healthy
    ports:
      - "${DOCFLOW_HTTPS_BIND:-443}:443"
    volumes:
      - ${DOCFLOW_CADDYFILE_PATH:-./caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  pgdata:
  seaweedfs_data:
  seq_data:
  backup_staging:

  caddy_data:
    external: true
    name: ${DOCFLOW_CADDY_DATA_VOLUME:-docflow-caddy-data}

  caddy_config:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE_PATH:?Set POSTGRES_PASSWORD_FILE_PATH}
  seq_admin_password:
    file: ${SEQ_ADMIN_PASSWORD_FILE_PATH:?Set SEQ_ADMIN_PASSWORD_FILE_PATH}
  s3_secret_key:
    file: ${S3_SECRET_KEY_FILE_PATH:?Set S3_SECRET_KEY_FILE_PATH}
  settings_key:
    file: ${DOCFLOW_SETTINGS_KEY_PATH:?Set DOCFLOW_SETTINGS_KEY_PATH}
